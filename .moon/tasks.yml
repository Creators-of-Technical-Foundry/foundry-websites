$schema: "https://moonrepo.dev/schemas/tasks.json"

tasks:
  exec:
    command: "docker compose exec --workdir=/srv/$projectSource --user=${UID:-1001}:${GID:-1001} repo"
    local: true
    deps: [ "repo:up" ]

  up:
    command: docker compose up --detach
    local: true

  down:
    command: docker compose down
    local: true
